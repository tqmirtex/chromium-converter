<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ファイル変換 - 権限の確認</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
    <script type="module" src="/src/permission/main.ts"></script>
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1 class="title">画像の取得を許可してください</h1>
        <p class="subtitle">
          右クリックした画像を変換するには、ウェブ上の画像を読み込む権限が必要です。読み込んだ画像は、この端末の中だけで変換します。
        </p>
      </header>
      <div class="section">
        <button id="allow" type="button" class="button-primary">許可して変換する</button>
        <button id="deny" type="button" class="button-secondary">キャンセル</button>
        <p class="summary">許可は一度だけで済みます。chrome://extensions の「詳細」からいつでも取り消せます。</p>
      </div>
    </main>
  </body>
</html>
